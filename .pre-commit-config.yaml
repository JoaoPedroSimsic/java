# Secret and credential guardrails (PRD §6).
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline

  - repo: local
    hooks:
      - id: block-secrets-env
        name: block secrets.env and .env commits
        entry: bash -c 'for f in "$@"; do case "$f" in *.example|*.example.*|secrets.env.example) continue ;; esac; base=$(basename "$f"); if [[ "$base" == "secrets.env" || "$base" == ".env" ]]; then echo "Refusing to commit $f — use *.example templates only"; exit 1; fi; done' --
        language: system
        files: (secrets\.env$|^\.env$)
