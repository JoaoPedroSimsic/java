spring:
  cloud:
    aws:
      region:
        static: ${AWS_DEFAULT_REGION}
      # Credentials via EKS IRSA (DefaultCredentialsProvider); do not inject static keys.

  rabbitmq:
    listener:
      type: simple
      simple:
        auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized 
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: true
