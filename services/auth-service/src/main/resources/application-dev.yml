management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, beans, conditions, configprops
  endpoint:
    env:
      enabled: false
    configprops:
      show-values: never
    beans:
      show-values: never
    health:
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: true
cognito:
  userPoolId: "unused-in-dev"
  clientId: "unused-in-dev"
  clientSecret: "unused-in-dev"
  domainUrl: "unused-in-dev"
  region: "us-east-1"

keycloak:
  server-url: ${KC_SERVER_URL}
  external-url: ${KC_EXTERNAL_URL:}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  admin:
    username: ${KEYCLOAK_ADMIN}
    password: ${KEYCLOAK_ADMIN_PASSWORD}

