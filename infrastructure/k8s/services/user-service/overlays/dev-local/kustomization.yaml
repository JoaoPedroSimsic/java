apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../../../shared/postgres/user-db/overlays/dev-local
- ../../../../shared/redis/user-redis/overlays/dev
configMapGenerator:
- name: user-service-config
  envs:
  - ../dev/params.env
secretGenerator:
- name: user-service-secrets
  envs:
  - ../dev/secrets.env
labels:
- pairs:
    environment: dev
    secret-source: local
  includeSelectors: true
