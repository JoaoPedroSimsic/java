apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../../../shared/postgres/user-db/overlays/staging
- ../../../../shared/redis/user-redis/overlays/staging
- serviceaccount.yaml
configMapGenerator:
- name: user-service-config
  envs:
  - params.env
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: user-service
    spec:
      template:
        spec:
          serviceAccountName: user-service
- patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: user-service\n\
    spec:\n  replicas: 2\n  template:\n    spec:\n      containers:\n      - name:\
    \ user-service\n        resources:\n          requests:\n            memory: \"\
    512Mi\"\n            cpu: \"500m\"\n          limits:\n            memory: \"\
    1Gi\"\n            cpu: \"1000m\""
labels:
- pairs:
    environment: staging
  includeSelectors: true
