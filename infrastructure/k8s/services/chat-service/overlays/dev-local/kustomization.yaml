apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
configMapGenerator:
- name: chat-service-config
  envs:
  - params.env
secretGenerator:
- name: chat-service-secrets
  envs:
  - secrets.env
labels:
- pairs:
    environment: dev
    secret-source: local
  includeSelectors: true
