apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../shared/rabbitmq/overlays/dev-local
  - ../../shared/nats/overlays/dev
  - ../../shared/dynamodb/overlays/dev
  - ../../shared/keycloak/overlays/dev-local
  - ../../shared/ingress/overlays/dev

  - ../../services/auth-service/overlays/dev-local
  - ../../services/user-service/overlays/dev-local
  - ../../gateways/http-gateway/overlays/dev-local
  - ../../gateways/ws-gateway/overlays/dev-local

namespace: hermes-dev

labels:
  - pairs:
      environment: dev
      cluster: dev
      secret-source: local
      managed-by: kustomize
  - ../../services/chat-service/overlays/dev-local
