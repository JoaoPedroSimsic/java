apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets-vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-hermes-dev
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets-vault
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: hermes/dev/services/keycloak/keycloak-admin
        property: username
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: hermes/dev/services/keycloak/keycloak-admin
        property: password
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: hermes/dev/shared/github-oauth
        property: client_secret
