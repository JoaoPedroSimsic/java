apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chat-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-hermes-dev
    kind: ClusterSecretStore
  target:
    name: chat-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: hermes/dev/shared/rabbitmq
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: hermes/dev/shared/rabbitmq
        property: password
