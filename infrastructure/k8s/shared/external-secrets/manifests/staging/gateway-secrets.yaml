apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-hermes-staging
    kind: ClusterSecretStore
  target:
    name: gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: GATEWAY_SECRET
      remoteRef:
        key: hermes/staging/shared/jwt-signing-key
        property: value
