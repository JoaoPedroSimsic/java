apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmq-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-hermes-staging
    kind: ClusterSecretStore
  target:
    name: rabbitmq-secrets
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: hermes/staging/shared/rabbitmq
        property: username
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: hermes/staging/shared/rabbitmq
        property: password
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: hermes/staging/shared/rabbitmq
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: hermes/staging/shared/rabbitmq
        property: password
