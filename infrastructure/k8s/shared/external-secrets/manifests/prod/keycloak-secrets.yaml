apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-hermes-prod
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: hermes/prod/services/keycloak/keycloak-admin
        property: username
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: hermes/prod/services/keycloak/keycloak-admin
        property: password
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: hermes/prod/shared/github-oauth
        property: client_secret
