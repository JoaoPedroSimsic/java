apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-hermes-prod
    kind: ClusterSecretStore
  target:
    name: auth-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_USER
      remoteRef:
        key: hermes/prod/services/auth-db/postgres
        property: APP_USER
    - secretKey: APP_PASSWORD
      remoteRef:
        key: hermes/prod/services/auth-db/postgres
        property: APP_PASSWORD
    - secretKey: FLYWAY_USER
      remoteRef:
        key: hermes/prod/services/auth-db/postgres
        property: FLYWAY_USER
    - secretKey: FLYWAY_PASSWORD
      remoteRef:
        key: hermes/prod/services/auth-db/postgres
        property: FLYWAY_PASSWORD
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: hermes/prod/shared/rabbitmq
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: hermes/prod/shared/rabbitmq
        property: password
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: hermes/prod/shared/github-oauth
        property: client_secret
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: hermes/prod/services/keycloak/keycloak-admin
        property: username
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: hermes/prod/services/keycloak/keycloak-admin
        property: password
    - secretKey: COGNITO_CLIENT_SECRET
      remoteRef:
        key: hermes/prod/services/auth-service/cognito
        property: client_secret
