apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
configMapGenerator:
- name: keycloak-config
  envs:
  - params.env
secretGenerator:
- name: keycloak-secrets
  envs:
  - secrets.env
labels:
- pairs:
    environment: dev
  includeSelectors: true
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: keycloak
    spec:
      template:
        spec:
          containers:
          - name: keycloak
            resources:
              requests:
                memory: "1536Mi"
                cpu: "500m"
              limits:
                memory: "3Gi"
                cpu: "1000m"
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: keycloak
    spec:
      type: NodePort
      ports:
        - name: "8180"
          port: 8180
          targetPort: 8180
          nodePort: 30180
