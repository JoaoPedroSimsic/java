apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  labels:
    app: dynamodb-local
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb-local
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dynamodb-local
        component: database
    spec:
      containers:
      - name: dynamodb-local
        image: amazon/dynamodb-local:latest
        args:
        - "-jar"
        - "DynamoDBLocal.jar"
        - "-sharedDb"
        - "-dbPath=/data"
        ports:
        - containerPort: 8000
          name: dynamodb
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dynamodb-data
