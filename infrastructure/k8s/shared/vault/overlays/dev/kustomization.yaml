apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault

resources:
  - namespace.yaml

helmCharts:
  - name: vault
    repo: https://helm.releases.hashicorp.com
    version: 0.31.0
    releaseName: vault
    namespace: vault
    valuesInline:
      global:
        enabled: true
      injector:
        enabled: false
      server:
        enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        dev:
          enabled: true
        service:
          enabled: true
          type: ClusterIP
          port: 8200
      ui:
        enabled: true

labels:
  - pairs:
      app.kubernetes.io/part-of: hermes
      environment: dev
