# Restrict Vault API (8200) to ESO and in-namespace traffic (PRD §6).
# Operator kubectl port-forward is unaffected (kubelet path, not pod ingress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-api-restrict
  labels:
    app.kubernetes.io/part-of: hermes
    environment: dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8200
