apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
configMapGenerator:
- name: ws-gateway-config
  envs:
  - params.env
labels:
- pairs:
    environment: dev
  includeSelectors: true
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ws-gateway
    spec:
      template:
        spec:
          containers:
          - name: ws-gateway
            envFrom:
            - configMapRef:
                name: ws-gateway-config
