name: Build images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || '' }}
    strategy:
      fail-fast: false
      matrix:
        service: [http-gateway, auth-service, user-service]
        include:
          - service: http-gateway
            path: gateways/http-gateway
          - service: auth-service
            path: services/auth-service
          - service: user-service
            path: services/user-service

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-java-maven

      - name: Package application
        run: mvn package -DskipTests -pl ${{ matrix.path }} -am

      - name: Resolve image metadata
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          SHORT_SHA="${SHA:0:7}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hermes-${{ matrix.service }}:${{ steps.meta.outputs.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hermes-${{ matrix.service }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hermes-${{ matrix.service }}:${{ steps.meta.outputs.branch == 'main' && 'latest' || format('{0}-latest', steps.meta.outputs.branch) }}
