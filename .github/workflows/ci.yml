name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: detect-secrets
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan --baseline .secrets.baseline

  java-integration:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-maven

      - name: Build and test
        run: mvn clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  go-integration:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go

      - name: Install dependencies
        run: go mod download
        working-directory: gateways/ws-gateway

      - name: Run all Go tests
        run: |
          find . -name "go.mod" -not -path "*/node_modules/*" -print0 | xargs -0 -I {} sh -c '
            dir=$(dirname "{}")
            echo "Testing service in: $dir"
            cd "$dir" && go test -v ./...
          '

  frontend:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Build
        working-directory: frontend
        run: bun run build

  infra-validate:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt and validate
        working-directory: infrastructure/terraform/secrets-manager
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Kustomize overlays
        run: |
          for env in staging prod; do
            echo "Validating cluster overlay: $env"
            kubectl kustomize "infrastructure/k8s/clusters/${env}" \
              --load-restrictor=LoadRestrictionsNone --enable-helm > /dev/null
          done

  docker-build:
    needs: [secret-scan, java-integration, go-integration]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [http-gateway, auth-service, user-service]
        include:
          - service: http-gateway
            path: gateways/http-gateway
          - service: auth-service
            path: services/auth-service
          - service: user-service
            path: services/user-service
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: false
