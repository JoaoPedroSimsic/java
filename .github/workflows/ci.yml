name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DEVSPACE_VERSION: 'v6.3.20'
  TERRAFORM_VERSION: '1.15.5'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "services=$(jq -c . .github/services.json)" >> "$GITHUB_OUTPUT"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: detect-secrets
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan --baseline .secrets.baseline

  java-integration:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  go-integration:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download
        working-directory: gateways/ws-gateway

      - name: Run all Go tests
        run: |
          find . -name "go.mod" -not -path "*/node_modules/*" -print0 | xargs -0 -I {} sh -c '
            dir=$(dirname "{}")
            echo "Testing service in: $dir"
            cd "$dir" && go test -v ./...
          '

  frontend:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Build
        working-directory: frontend
        run: bun run build

  infra-validate:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt and validate (secrets-manager)
        working-directory: infrastructure/terraform/secrets-manager
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Build Lambda (github-auth)
        working-directory: infrastructure/lambda/github-auth
        run: |
          bun install --frozen-lockfile
          bun run package

      - name: Terraform fmt and validate (cognito)
        working-directory: infrastructure/terraform/cognito
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create stub secrets.env files
        run: |
          find infrastructure/k8s -path "*/dev-local/kustomization.yaml" -print0 \
            | xargs -0 -I{} dirname {} \
            | while read -r dir; do
                if grep -q 'secrets\.env' "$dir/kustomization.yaml"; then
                  touch "$dir/secrets.env"
                fi
              done

      - name: Validate Kustomize overlays
        run: |
          for env in dev dev-local-secrets staging prod; do
            echo "Validating cluster overlay: $env"
            kubectl kustomize "infrastructure/k8s/clusters/${env}" \
              --load-restrictor=LoadRestrictionsNone --enable-helm > /dev/null
            echo "OK: $env"
          done

      - name: Cache DevSpace
        id: devspace-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/devspace
          key: devspace-${{ env.DEVSPACE_VERSION }}-linux-amd64

      - name: Download DevSpace
        if: steps.devspace-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/devspace \
            "https://github.com/devspace-sh/devspace/releases/download/${{ env.DEVSPACE_VERSION }}/devspace-linux-amd64"
          chmod +x ~/.local/bin/devspace

      - name: Validate DevSpace config
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export KUBECONFIG=/dev/null
          devspace print > /dev/null 2>&1
          for profile in local-secrets integration dynamic-secrets staging prod; do
            echo "Validating DevSpace profile: $profile"
            devspace print -p "$profile" > /dev/null 2>&1
            echo "OK: $profile"
          done

  container-build:
    needs: [secret-scan, java-integration, go-integration, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Podman
        run: |
          bash scripts/setup-podman.sh
          podman --version
          podman info --format json | jq -r '"ociRuntime=\(.host.ociRuntime.name // "unknown") cgroupVersion=\(.host.cgroupVersion)"'

      - name: Build container image
        run: |
          podman build --network=host \
            -t hermes-${{ matrix.service }}:ci \
            -f ${{ matrix.path }}/Dockerfile \
            ${{ matrix.context }}

      - name: Inspect image
        run: |
          size=$(podman image inspect hermes-${{ matrix.service }}:ci --format '{{.Size}}')
          layers=$(podman history --no-trunc --format '{{.Size}}' hermes-${{ matrix.service }}:ci | wc -l)
          user=$(podman inspect hermes-${{ matrix.service }}:ci --format '{{.Config.User}}')
          echo "size=$(( size / 1024 / 1024 ))MB layers=${layers} user=${user:-root}"
          if [[ -z "$user" || "$user" == "root" || "$user" == "0" ]]; then
            echo "::warning::${{ matrix.service }} runs as root — add a non-root USER to the Dockerfile"
          fi

      - name: Start Podman socket for Trivy
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          sleep 2
          echo "DOCKER_HOST=unix:///tmp/podman.sock" >> "$GITHUB_ENV"

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost/hermes-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table

  infra-test:
    needs: [infra-validate, container-build]
    runs-on: ubuntu-latest
    steps:
      - name: Podman smoke test
        run: podman run --rm docker.io/library/alpine:3.19 echo "podman works"

      - name: Rootless network test
        run: |
          podman run --rm --network=host docker.io/library/alpine:3.19 \
            sh -c "apk add --no-cache curl > /dev/null 2>&1 && echo 'rootless networking OK'"
